services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      # CONSTRUCTED HERE from the POSTGRES_* variables, deliberately NOT inherited from a
      # DATABASE_URL set in .env. `postgres` is the compose service name on the line below and
      # resolves only inside this network; from the host it is `getaddrinfo EAI_AGAIN postgres`.
      # Meanwhile drizzle-kit run on the HOST reads only `.env` — its bundled dotenv resolves
      # path.resolve(cwd, ".env") and the string .env.local does not occur anywhere in
      # drizzle-kit/bin.cjs — so `.env` has to carry the HOST url (localhost:5433, the port
      # published by the postgres service below at 5433:5432) or every documented host-side
      # migrate command fails. One file cannot hold both perspectives, so the container's url is
      # built here and the host's lives in .env. Pointing this line back at an interpolated
      # DATABASE_URL re-breaks `npm run db:migrate` from the host: that is the papercut every
      # phase since 33 paid for with an inline DATABASE_URL= override, and
      # src/lib/__tests__/compose-uploads-persistence.test.ts now goes red on the revert.
      # Nothing is lost by not interpolating: all three POSTGRES_* are already required by the
      # postgres service below, so a .env that can start the database can start the app.
      #
      # THE EXTERNAL-DATABASE ROUTE IS APP_DATABASE_URL, and it is deliberately a SEPARATE name.
      # An operator running Postgres somewhere else (RDS, Neon, Supabase, another host) sets
      # APP_DATABASE_URL in .env and this container connects there instead; unset or empty falls
      # back to the bundled service on the line below, which is the default path. It cannot be
      # DATABASE_URL itself, because that key in .env is the HOST-side string drizzle-kit reads
      # and the two describe opposite sides of the network boundary. Between phase 46 landing and
      # this line, `docs/admin/deployment/docker.md` "Option B: External PostgreSQL" was silently
      # inert: the reader edited DATABASE_URL, the container ignored it, and the app came up green
      # while writing to the throwaway local container. Option B now sets APP_DATABASE_URL, and
      # src/lib/__tests__/compose-uploads-persistence.test.ts asserts that this entry is an
      # override-with-fallback whose override variable is NOT DATABASE_URL, and that the Docker
      # guide names the same variable this line reads.
      #
      # PASSWORD ENCODING (applies to the fallback below): POSTGRES_PASSWORD is interpolated into
      # a URL here with no percent-encoding, so a password containing / # ? % : or @ produces a
      # malformed DSN and a connection error that points at the URL rather than at the password.
      # Use unreserved characters only (A-Za-z0-9-._~); `openssl rand -hex 32` is a safe
      # generator. An operator who needs a reserved character sets APP_DATABASE_URL and does the
      # encoding themselves. .env.example carries the same warning above POSTGRES_PASSWORD.
      - DATABASE_URL=${APP_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      # Observability (both optional). These MUST be listed here: this file has no
      # `env_file:`, so a variable absent from this list never reaches the container.
      # Without these two entries, LOG_LEVEL=debug in .env would change nothing and
      # SENTRY_DSN would never be seen — both features would appear to work while
      # neither functioned, and nothing would fail.
      - LOG_LEVEL=${LOG_LEVEL}
      - SENTRY_DSN=${SENTRY_DSN}
      # MANDATORY alongside the volume below — load-bearing, not tidiness. UPLOAD_DIR
      # defaults to /tmp/uploads (src/app/api/upload/route.ts:12) and, per the comment
      # above, this file has no `env_file:`. So WITHOUT this line the app writes to /tmp
      # and the uploads_data volume below stays empty forever: a persistence fix that
      # ships, reviews clean, and does nothing, with nothing erroring anywhere.
      # Hardcoded rather than ${UPLOAD_DIR} so it can never disagree with the mount
      # target on the next line — an operator who set UPLOAD_DIR=/srv/files in .env would
      # otherwise move the write path out from under the mount and silently lose
      # persistence again. Changing the path means editing both lines, which is honest
      # and which src/lib/__tests__/compose-uploads-persistence.test.ts enforces by
      # asserting the two are equal.
      - UPLOAD_DIR=/app/uploads
    volumes:
      # Uploaded files (FILE_STORAGE=local, the default). Without this, uploads live in
      # the container filesystem and are destroyed by every `docker compose up --build`,
      # while postgres survives — leaving restored rows pointing at files that no longer
      # exist. Backup/restore procedure: docs/admin/backup-restore.md.
      # Alternative for an operator who wants uploads inside an existing host backup
      # sweep: `- ./uploads:/app/uploads`. That host directory must be chown 1001:1001,
      # because the container runs as uid 1001; a named volume avoids that entirely.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Deliberately NO health check on `app`: /api/health legitimately returns 503
    # when a background worker reads stale, and combined with `restart: unless-stopped`
    # a probe on that endpoint could restart-loop the container — turning an
    # observability feature into the outage it exists to reveal. Adding one is its
    # own decision, not this phase's.
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
