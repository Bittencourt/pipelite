# Gates every push to master and every pull request targeting master on the
# same three commands a developer runs locally: tsc --noEmit, eslint, vitest run.
#
# Actions are pinned to full commit SHAs, not to the mutable `v7` major tag an owner can
# re-point at any commit. Resolved against the GitHub API on 2026-08-14 (both SHAs are what
# `v7` pointed at that day), so the pin is behaviour-preserving:
#   actions/checkout   v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node v7.0.0 -> 820762786026740c76f36085b0efc47a31fe5020
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Deliberately no path filter. A workflow skipped by a path filter never
  # reports its check, and GitHub treats a required check that never reports as
  # permanently pending — every docs-only PR would become unmergeable. The full
  # run is ~95s, so there is nothing worth optimising away.

# Least privilege: this job only reads code. It publishes nothing and comments
# nothing, so read access to the repository contents is all it ever needs.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so rapid pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # This name is the check-run name a maintainer requires in the master
    # ruleset — keep it short and stable.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # WHY THIS JOB NOW HAS A DATABASE.
    # The from-zero migration check (DEPLOY-01) builds a throwaway database with
    # `drizzle-kit migrate` alone and compares its catalog against the schema this
    # repository claims to ship, so it needs a real PostgreSQL server. It lands HERE,
    # on the required `ci` check, rather than in a workflow of its own: a new workflow
    # publishes a new check-run name that is not in the master ruleset, so it could go
    # red for weeks without blocking a single merge. A non-blocking gate is a gate that
    # does not gate.
    #
    # A service container references an IMAGE, not an action, so there is no commit SHA
    # to pin here. That is a deliberate exception to the rule at the top of this file,
    # not an oversight: the tag below is the one docker-compose.yml already runs, and
    # src/lib/mutations/__tests__/db-test-isolation.test.ts reads BOTH files and asserts
    # the two values are equal, so they cannot drift apart. The container holds nothing
    # but a database this job creates and drops within its own run.
    #
    # What this database does NOT do: it does not make the database-backed vitest
    # project reachable from this check. That project is still excluded from the base
    # project's glob, is still invoked by no step here, and that same gate now
    # enumerates every step below to prove it — a suite that needs a database and is
    # reachable from the required check would leave every pull request permanently
    # pending, which is the failure mode the whole arrangement exists to avoid.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # The runner starts this container before the first step, but the server inside
        # it is not accepting connections yet. Without a health check the migration step
        # races Postgres' own startup and fails intermittently on a correct chain — an
        # intermittently-red required check is worse than no check at all.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads code; it never pushes. Without this, checkout leaves the
          # GITHUB_TOKEN in .git/config while `npm ci` below runs third-party postinstall
          # scripts in the same job.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Active LTS (EOL 2028-04-30). The binding engines floor is
          # @napi-rs/lzma-linux-x64-gnu's ^22.20 || ^24.12 || >=25, reached
          # transitively via rollup — it superseded vite's floor in August 2026,
          # which is why nothing here is compared against a hardcoded number.
          # This pin, package.json engines.node and the three Dockerfile tags
          # are asserted against each other and against every engines.node range
          # in package-lock.json by
          # src/lib/__tests__/node-engines-floor.test.ts. Move all four together.
          node-version: 24
          # Caches the global npm cache (not node_modules), keyed on
          # package-lock.json, so it can never yield a half-installed tree.
          cache: npm

      - name: Install dependencies
        # Lockfile-exact and fails on a lockfile/manifest mismatch. Verified to
        # exit 0 on a clean checkout with no extra install flags.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Report all three gates in one run. Without this, a job aborts at the
        # first failing step and a contributor discovers the lint failure only
        # after fixing the type error. This condition is the modern replacement
        # for always(), which also burns minutes on cancelled runs.
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Migration chain check
        # DEPLOY-01. Creates a throwaway database on the service above, migrates it from
        # zero with `drizzle-kit migrate` and asserts its CATALOG against
        # drizzle/meta/<last>_snapshot.json, then drops it in a `finally`. It never
        # branches on the child's exit code: `drizzle-kit migrate` prints the same success
        # line for 0 applied migrations as for 20, which is exactly how a missing
        # CREATE TABLE shipped undetected once already.
        #
        # WHAT THIS STEP PROVES, EXACTLY. There is no populated reference database on this
        # runner, so the script prints an explicit `SKIPPED: reference equivalence` line —
        # branch 4 of its documented reference-selection order. That is a STATED skip, not
        # a silent pass, but it is not nothing-lost either, and an earlier version of this
        # comment overstated it as "fully authoritative", which it is not. What actually
        # runs here is assertion set A:
        #
        #   PROVED HERE     table names (both directions), column names (both directions),
        #                   column NULLABILITY, the 41 declared index names, and index
        #                   names the build creates that neither the snapshot declares nor
        #                   a constraint backs (both directions).
        #   NOT PROVED HERE column TYPES and lengths, DEFAULT expressions, foreign keys,
        #                   check and unique constraints, enum labels, functions,
        #                   extensions and index DEFINITIONS (columns, uniqueness, method).
        #                   Those are the ten-dimension comparison, and it needs a
        #                   populated reference. A from-zero build that made `deals.amount`
        #                   text instead of numeric, or dropped a foreign key, passes this
        #                   step.
        #
        # Closing that gap is BACKLOG MIG-02 — the snapshot JSON already carries `type`,
        # `default`, `foreignKeys`, `uniqueConstraints` and per-index column lists, so it
        # is a matter of reading them, not of provisioning anything. Until then, do not
        # describe this step as a full schema equivalence check.
        if: ${{ !cancelled() }}
        env:
          # The service publishes 5432 on the runner's localhost. The script resolves
          # process.env.DATABASE_URL before it looks for a .env file, and there is no
          # .env on a fresh checkout, so this is the only place the target is named.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run db:check-migrations

      - name: Security audit policy
        # SEC-05. Runs `npm audit` over package-lock.json and applies the root audit-policy.json:
        # every critical and high advisory must either be FIXED or carry an unexpired, reasoned
        # allowlist entry. AUDIT-POLICY.md states the policy itself, including what a reason has to
        # do to count as one.
        #
        # The verdict is the POLICY's, never npm's own exit code. `npm audit` exits 1 whenever ANY
        # advisory exists at ANY severity, so its exit code cannot distinguish a fully-disposed
        # tree from one carrying an unallowlisted critical, and a gate built on it is either always
        # red or has been silenced.
        #
        # THIS STEP NEEDS NETWORK, and there is no way around that. Advisory data lives at the
        # registry's bulk endpoint; there is no offline advisory database to fall back to, and
        # `--package-lock-only` changes the TREE source, not the ADVISORY source. It therefore FAILS
        # CLOSED, deliberately: empty stdout, unparseable JSON, a missing `vulnerabilities` object,
        # or a document reporting fewer than 500 audited packages is FATAL rather than a pass,
        # because a network failure, a proxy interception and an `npm audit --json` schema change ALL
        # otherwise produce zero offenders and a clean green. A gate that passes when it could not
        # fetch the data it judges is worse than no gate: it reports confidence it does not have.
        #
        # That is MEASURED, not assumed. Pointed at an unreachable registry
        # (`npm_config_registry=http://127.0.0.1:9/`) on 2026-08-25 the advisory POST returns
        # ECONNREFUSED and the gate exits 1 with `FATAL: the audit document has no
        # `vulnerabilities` object`. On the real registry the same day it exits 0: 47 advisories
        # across 14 vulnerable packages, 39 at critical/high, all 39 dispositioned, 1285
        # dependencies audited.
        #
        # WHAT THIS STEP PROVES, EXACTLY.
        #
        #   PROVED HERE     the advisory position of package-lock.json — the exact tree `npm ci`
        #                   installs, which is this job's tree and every contributor's.
        #   NOT PROVED HERE the tree inside the published Docker image. Dockerfile:24 installs with
        #                   `npm install --legacy-peer-deps`, which is not lockfile-exact by
        #                   contract; measured 2026-08-25 it produced a strict SUBSET of the
        #                   lockfile tree (41 packages fewer, zero version differences, none of the
        #                   41 carrying a critical or high advisory), and the runtime image narrows
        #                   further still via Next's standalone trace. So this gate is a
        #                   conservative over-approximation of the image's advisory surface: it can
        #                   report an advisory in a package the image never ships, and it cannot by
        #                   itself prove which version the image resolved. Converting Dockerfile:24
        #                   to `npm ci --legacy-peer-deps` would collapse the two trees into one and
        #                   retire this caveat; that is BACKLOG, not this step's job. Until then, do
        #                   not describe this step as auditing production.
        #
        # No `env:` and no secret: it reads two files already in the checkout and posts a dependency
        # tree the registry resolved in the first place. No action, so no new SHA pin.
        if: ${{ !cancelled() }}
        run: npm run security:audit

      - name: Registry signature verification
        # The TAMPER half of SEC-05, and the reason it is a step of its own rather than folded into
        # the policy gate above: advisory data describes known vulnerabilities in the versions a
        # lockfile names, and says nothing whatever about whether the tarball the registry served is
        # the one its publisher signed. This is the only check in this repository that looks at
        # that. Two questions, two steps, so a failure in one cannot mask or be mistaken for the
        # other.
        #
        # Measured against a fully installed tree, 2026-08-25: 1100 packages audited, 1100 with
        # verified registry signatures, 175 with verified attestations, zero failures, 20 s on a warm
        # npm cache. An earlier cold-cache run on a slightly earlier lockfile measured 1104/1104 with
        # 169 attestations in 102 s. Both are recorded because the SPREAD is the useful number: the
        # cost is dominated by cache state, not by the tree.
        #
        # IT ORDERS AFTER `Install dependencies` FOR A REASON, and the reason is not cosmetic. This
        # subcommand reads the INSTALLED tree, not package-lock.json, and `--package-lock-only` does
        # not change that. Run with no node_modules present it exits 1 with `found no dependencies to
        # audit that were installed from a supported registry` — measured. So it fails closed rather
        # than vacuously reporting "0 packages verified, no failures", but only because a real
        # install precedes it. If these steps are ever reordered ahead of `npm ci`, this one stops
        # being a gate and starts being an error.
        #
        # COST, in the same register as the "deliberately no path filter" note at the top of this
        # file: up to ~102 s cold, taking this job from ~95 s to ~200 s against a
        # `timeout-minutes: 15` budget, which has ample room. That price was accepted deliberately —
        # a minute of runner time for the only tamper-detection gate in the repository is a good
        # trade — and the numbers are recorded here so the next person weighing it does not have to
        # measure them again.
        #
        # IF IT PROVES FLAKY ON NETWORK: say so, with the failing runs as evidence, and re-decide in
        # the open. Do not quietly delete the step, because a deleted gate is indistinguishable from
        # a gate that never existed, and the next reader will assume signatures were never checked.
        #
        # No `env:` and no secret; no action, so no new SHA pin.
        if: ${{ !cancelled() }}
        run: npm audit signatures
